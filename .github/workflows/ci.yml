name: Clothing store checks
on:
  push:
    branches: [main, develop, feature/clothing-store-mvp]
  pull_request:
    branches: [main, develop]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --include=dev
      - run: npm run check
      - run: npm test
      - run: npm run build
